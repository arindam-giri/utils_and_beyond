<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>markdown.render — local preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;800;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0a0a0a;
  --text: #ffffff;
  --text-soft: #dadada;
  --text-dim: #6a6a6a;
  --accent: rgba(200,170,130, 1);
  --accent-soft: rgba(200,170,130, 0.25);
  --line: rgba(255,255,255,0.10);
  --line-soft: rgba(255,255,255,0.06);
  --surface: rgba(255,255,255,0.015);
  --surface-2: rgba(255,255,255,0.04);
  --surface-3: rgba(255,255,255,0.025);
}

[data-theme="light"] {
  --bg: #fafaf7;
  --text: #1a1a1a;
  --text-soft: #3a3a3a;
  --text-dim: #888888;
  --accent: #8a6a3a;
  --accent-soft: rgba(138,106,58, 0.25);
  --line: rgba(0,0,0,0.10);
  --line-soft: rgba(0,0,0,0.06);
  --surface: rgba(0,0,0,0.02);
  --surface-2: rgba(0,0,0,0.05);
  --surface-3: rgba(0,0,0,0.03);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color 320ms cubic-bezier(.22,1,.36,1),
              color 320ms cubic-bezier(.22,1,.36,1);
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}

.brand-dot {
  width: 8px;
  height: 8px;
  background: var(--accent);
  animation: blink 1.2s steps(2) infinite;
  transition: background-color 320ms cubic-bezier(.22,1,.36,1);
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  50.01%, 100% { opacity: 0.18; }
}

.brand-name {
  font-weight: 700;
  letter-spacing: 0.06em;
  font-size: 13px;
  color: var(--text);
}

.brand-sub {
  color: var(--text-dim);
  font-size: 10px;
  letter-spacing: 0.18em;
  margin-top: 2px;
}

.tools {
  display: flex;
  gap: 1.75rem;
  align-items: center;
}

.tool-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 300ms cubic-bezier(.22,1,.36,1);
  padding: 0.25rem 0;
  position: relative;
}

.tool-btn::after {
  content: '';
  position: absolute;
  left: 0; bottom: -2px;
  width: 0; height: 1px;
  background: var(--accent);
  transition: width 400ms cubic-bezier(.22,1,.36,1);
}
.tool-btn:hover { color: var(--accent); }
.tool-btn:hover::after { width: 100%; }

/* Main split */
.main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
}

.pane {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.pane-left {
  border-right: 1px solid var(--line);
}

.pane-label {
  display: flex;
  justify-content: space-between;
  padding: 0.7rem 1.5rem;
  border-bottom: 1px solid var(--line-soft);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface);
  transition: background-color 320ms cubic-bezier(.22,1,.36,1),
              border-color 320ms cubic-bezier(.22,1,.36,1),
              color 320ms cubic-bezier(.22,1,.36,1);
}

.pane-label .accent { color: var(--accent); margin: 0 0.3em; }

.pane-left:focus-within .pane-label > span:first-child { color: var(--accent); }

.editor-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
}

#editor {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-soft);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.75;
  padding: 1.5rem;
  resize: none;
  tab-size: 2;
  caret-color: var(--accent);
  transition: color 320ms cubic-bezier(.22,1,.36,1);
}

#editor::placeholder { color: var(--text-dim); }

#editor::-webkit-scrollbar { width: 8px; }
#editor::-webkit-scrollbar-track { background: transparent; }
#editor::-webkit-scrollbar-thumb { background: var(--line); }
#editor::-webkit-scrollbar-thumb:hover { background: var(--accent-soft); }

.preview-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem 2rem 3rem;
}

.preview-wrap::-webkit-scrollbar { width: 8px; }
.preview-wrap::-webkit-scrollbar-track { background: transparent; }
.preview-wrap::-webkit-scrollbar-thumb { background: var(--line); }
.preview-wrap::-webkit-scrollbar-thumb:hover { background: var(--accent-soft); }

/* Rendered markdown */
.preview {
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-soft);
  max-width: 70ch;
  transition: color 320ms cubic-bezier(.22,1,.36,1);
}

.preview h1, .preview h2, .preview h3, .preview h4, .preview h5, .preview h6 {
  font-family: 'Inter', sans-serif;
  color: var(--text);
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 2.2rem 0 1rem;
  line-height: 1.2;
}

.preview h1 {
  font-size: 2.2rem;
  font-weight: 900;
  letter-spacing: -0.035em;
  line-height: 1.1;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0.6rem;
}

.preview h2 { font-size: 1.55rem; }
.preview h3 { font-size: 1.22rem; }
.preview h4 { font-size: 1.02rem; }

.preview h1:first-child, .preview h2:first-child, .preview h3:first-child { margin-top: 0; }

.preview p { margin: 1rem 0; }

.preview a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid var(--accent-soft);
  transition: border-color 300ms cubic-bezier(.22,1,.36,1);
}
.preview a:hover { border-color: var(--accent); }

.preview strong { color: var(--text); font-weight: 700; }
.preview em { color: var(--text); font-style: italic; }
.preview del { color: var(--text-dim); }

.preview ul, .preview ol {
  margin: 1rem 0;
  padding-left: 1.5rem;
}
.preview li { margin: 0.4rem 0; }
.preview li::marker { color: var(--accent); }

.preview blockquote {
  border-left: 2px solid var(--accent);
  padding: 0.3rem 0 0.3rem 1.5rem;
  margin: 1.5rem 0;
  color: var(--text-dim);
  font-style: italic;
  transition: border-color 320ms cubic-bezier(.22,1,.36,1),
              color 320ms cubic-bezier(.22,1,.36,1);
}
.preview blockquote p { margin: 0.4rem 0; }

.preview code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.86em;
  background: var(--surface-2);
  padding: 0.15em 0.4em;
  border: 1px solid var(--line-soft);
  color: var(--accent);
  transition: background-color 320ms cubic-bezier(.22,1,.36,1),
              border-color 320ms cubic-bezier(.22,1,.36,1),
              color 320ms cubic-bezier(.22,1,.36,1);
}

.preview pre {
  background: var(--surface-3);
  border: 1px solid var(--line);
  padding: 1rem 1.25rem;
  overflow-x: auto;
  margin: 1.25rem 0;
  font-size: 13px;
  line-height: 1.6;
  transition: background-color 320ms cubic-bezier(.22,1,.36,1),
              border-color 320ms cubic-bezier(.22,1,.36,1);
}

.preview pre code {
  background: none;
  border: none;
  padding: 0;
  color: var(--text-soft);
  font-size: inherit;
}

.preview hr {
  border: none;
  border-top: 1px solid var(--line);
  margin: 2.5rem 0;
}

.preview table {
  border-collapse: collapse;
  width: 100%;
  margin: 1.25rem 0;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
}

.preview th, .preview td {
  border: 1px solid var(--line);
  padding: 0.55rem 0.85rem;
  text-align: left;
}

.preview th {
  background: var(--surface-2);
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-size: 11px;
  transition: background-color 320ms cubic-bezier(.22,1,.36,1),
              color 320ms cubic-bezier(.22,1,.36,1);
}

.preview img {
  max-width: 100%;
  height: auto;
  border: 1px solid var(--line);
}

.preview-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 60vh;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
}

/* Footer */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.55rem 1.5rem;
  border-top: 1px solid var(--line);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface);
  transition: background-color 320ms cubic-bezier(.22,1,.36,1),
              border-color 320ms cubic-bezier(.22,1,.36,1),
              color 320ms cubic-bezier(.22,1,.36,1);
}

.stats { display: flex; gap: 1.75rem; }
.stats span b {
  color: var(--accent);
  font-weight: 400;
  margin-left: 0.55em;
  font-family: 'JetBrains Mono', monospace;
}

.footer-meta { color: var(--text-dim); font-size: 10px; letter-spacing: 0.15em; }

/* Mobile */
@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .pane-left { border-right: none; border-bottom: 1px solid var(--line); }
  .tools { gap: 1rem; }
  .footer { font-size: 9px; flex-direction: column; gap: 0.4rem; padding: 0.5rem 1rem; }
  .stats { gap: 1rem; }
  .preview { font-size: 14px; }
  .preview h1 { font-size: 1.7rem; }
  .preview h2 { font-size: 1.3rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-dot" aria-hidden="true"></div>
      <div>
        <div class="brand-name">MARKDOWN.RENDER</div>
        <div class="brand-sub">LOCAL · NO NETWORK · LIVE PREVIEW</div>
      </div>
    </div>
    <nav class="tools">
      <button class="tool-btn" id="btn-sample">Sample</button>
      <button class="tool-btn" id="btn-clear">Clear</button>
      <button class="tool-btn" id="btn-copy">Copy HTML</button>
      <button class="tool-btn" id="btn-theme">Light</button>
    </nav>
  </header>

  <main class="main">
    <section class="pane pane-left">
      <div class="pane-label">
        <span>EDITOR<span class="accent">/</span>RAW</span>
        <span id="cursor-pos">L1:C1</span>
      </div>
      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false" placeholder="# Paste your markdown here&#10;&#10;Left pane = raw text. Right pane = rendered output. No server, no autosave, nothing leaves your machine."></textarea>
      </div>
    </section>

    <section class="pane pane-right">
      <div class="pane-label">
        <span>PREVIEW<span class="accent">/</span>RENDERED</span>
        <span id="render-time">0ms</span>
      </div>
      <div class="preview-wrap">
        <div class="preview" id="preview"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="stats">
      <span>WORDS<b id="stat-words">0</b></span>
      <span>CHARS<b id="stat-chars">0</b></span>
      <span>LINES<b id="stat-lines">0</b></span>
      <span>READ<b id="stat-read">0min</b></span>
    </div>
    <div class="footer-meta">markdown.render — v1.0 · marked.js</div>
  </footer>

</div>

<script>
const editor   = document.getElementById('editor');
const preview  = document.getElementById('preview');
const sampleBtn = document.getElementById('btn-sample');
const clearBtn  = document.getElementById('btn-clear');
const copyBtn   = document.getElementById('btn-copy');
const themeBtn  = document.getElementById('btn-theme');

marked.setOptions({ breaks: true, gfm: true });

const sample = `# Hello, Markdown

A local renderer. **No network calls** — paste on the left, watch it render on the right.

## Inline elements

You can write *italic*, **bold**, ~~strikethrough~~, \`inline code\`, and [links](https://example.com). 

## Lists

Ordered:

1. First item
2. Second item
3. Third item

Unordered:

- Apples
- Oranges
- Pears

## Code block

\`\`\`javascript
function greet(name) {
  console.log(\`Hello, \${name}\`);
  return true;
}

greet('world');
\`\`\`

## Blockquote

> The best way to predict the future is to write it down.
> — someone, probably

## Table

| Feature   | Status |
|-----------|--------|
| Live preview | Yes |
| Local only   | Yes |
| Offline      | Yes |

---

That's it. Edit on the left, watch it render on the right.`;

function render() {
  const src = editor.value;
  const t0 = performance.now();

  if (!src.trim()) {
    preview.innerHTML = '<div class="preview-empty">— awaiting input —</div>';
  } else {
    preview.innerHTML = marked.parse(src);
  }

  const t1 = performance.now();
  document.getElementById('render-time').textContent = `${Math.round(t1 - t0)}ms`;
  updateStats(src);
}

function updateStats(src) {
  const words   = src.trim() ? src.trim().split(/\s+/).length : 0;
  const chars   = src.length;
  const lines   = src ? src.split('\n').length : 0;
  const readMin = words === 0 ? 0 : Math.max(1, Math.round(words / 200));

  document.getElementById('stat-words').textContent = words;
  document.getElementById('stat-chars').textContent = chars;
  document.getElementById('stat-lines').textContent = lines;
  document.getElementById('stat-read').textContent  = readMin + 'min';
}

function updateCursor() {
  const pos    = editor.selectionStart;
  const before = editor.value.substring(0, pos);
  const line   = before.split('\n').length;
  const col    = pos - before.lastIndexOf('\n');
  document.getElementById('cursor-pos').textContent = `L${line}:C${col}`;
}

editor.addEventListener('input', render);
editor.addEventListener('keyup', updateCursor);
editor.addEventListener('click', updateCursor);

// Tab → two spaces, don't jump focus
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end   = editor.selectionEnd;
    editor.value = editor.value.substring(0, start)
                 + '  '
                 + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    render();
  }
});

sampleBtn.addEventListener('click', () => {
  editor.value = sample;
  render();
  updateCursor();
  editor.focus();
  editor.setSelectionRange(0, 0);
});

clearBtn.addEventListener('click', () => {
  editor.value = '';
  render();
  updateCursor();
  editor.focus();
});

copyBtn.addEventListener('click', async () => {
  const html = preview.innerHTML;
  try {
    await navigator.clipboard.writeText(html);
    copyBtn.textContent = 'Copied';
  } catch {
    // Fallback for clipboard-blocked contexts
    const ta = document.createElement('textarea');
    ta.value = html;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); copyBtn.textContent = 'Copied'; }
    catch { copyBtn.textContent = 'Failed'; }
    document.body.removeChild(ta);
  }
  setTimeout(() => copyBtn.textContent = 'Copy HTML', 1400);
});

// ── Theme toggle ──────────────────────────────────────────────
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'light' ? 'Dark' : 'Light';
  try { localStorage.setItem('md-theme', theme); } catch {}
}

themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  setTheme(current === 'light' ? 'dark' : 'light');
});

// Init: stored preference → OS preference → dark
(function initTheme() {
  let stored;
  try { stored = localStorage.getItem('md-theme'); } catch {}
  if (stored === 'light' || stored === 'dark') {
    setTheme(stored);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    setTheme('light');
  } else {
    setTheme('dark');
  }
})();

// Boot with sample so the right pane is never empty on first paint
editor.value = sample;
render();
updateCursor();
</script>
</body>
</html>
